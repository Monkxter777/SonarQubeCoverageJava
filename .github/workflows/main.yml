name: workflow to build and review 

on:
  workflow_dispatch:
    inputs:
      job_name:
        description: 'enter the name of the job'
        required: true
        type: choice
        options:
          - job_maven
          - job_sonar


jobs:
  job_maven:
    if: ${{ github.event.inputs.job_name == 'job_maven'}}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: set up java
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: build the code by maven 
      run: mvn clean install 
  job_sonar:
    if: ${{ github.event.inputs.job_name == 'job_sonar'}}
    needs: job_maven
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build along with Maven cloud
      run:  mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar -Dsonar.projectKey=sonarqube-actions-org-sept2026_sonarqube-actions-project -Dsonar.organization=sonarqube-actions-org-sept2026 -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=$SONAR_TOKEN
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
